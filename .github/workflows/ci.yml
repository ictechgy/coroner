name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Build (release)
        run: swift build -c release
